<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17251a">
<title>Painel</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone.svg">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header>
  <button class="voltar oculto" id="btn-voltar" aria-label="Voltar para a vila">‹ Vila</button>
  <h1 id="titulo">Vila</h1>
  <span id="conexao">…</span>
</header>
<div id="aviso" class="aviso oculto" role="status">
  <span id="aviso-texto"></span>
  <button class="acao" id="btn-tentar">Tentar de novo</button>
</div>

<main>
  <section id="tela-parear" class="oculto">
    <div class="cartao">
      <h2>Parear este celular</h2>
      <p>No PC, rode <code>python -m remoto.api_http --parear</code> e digite
        o código de 6 dígitos aqui. Ele vale 5 minutos.</p>
      <input id="codigo" inputmode="numeric" autocomplete="one-time-code"
             maxlength="7" placeholder="000000">
      <p><button class="acao primario" id="btn-parear">Parear</button>
        <span id="parear-msg" class="fraco"></span></p>
    </div>
  </section>

  <!-- A Vila é a tela inteira. As outras áreas são objetos dela
       (a prateleira lá embaixo) e abrem por cima, cada uma com o seu tema. -->
  <section id="tela-vila" class="oculto">
    <div class="vila-caixa">
      <canvas id="vila-canvas" aria-label="A vila"></canvas>
      <div id="vila-placar" class="placar"></div>
      <div id="vila-escolhido" class="oculto"></div>
    </div>
  </section>

  <section id="tela-quadro" class="oculto livro quadro" aria-label="Quadro de avisos">
    <div class="cartao">
      <h2>Na vila agora</h2>
      <div id="vila-gente"></div>
    </div>
    <div class="cartao oculto" id="controle">
      <h2>Controle</h2>
      <div class="campos">
        <label>O quê
          <select id="alvo-pausa"></select>
        </label>
        <label>Por quanto tempo
          <select id="prazo-pausa">
            <option value="">sem prazo</option>
            <option value="30">30 min</option>
            <option value="60">1 hora</option>
            <option value="120">2 horas</option>
            <option value="240">4 horas</option>
          </select>
        </label>
      </div>
      <div class="botoes">
        <button class="acao" id="btn-pausar">⏸ Pausar</button>
        <button class="acao" id="btn-retomar">▶ Retomar</button>
        <button class="acao perigo" id="btn-parar">⏹ Parar</button>
      </div>
    </div>
    <div class="cartao">
      <h2>Próxima postagem</h2>
      <div class="grande" id="proxima">—</div>
      <div class="fraco" id="pausa"></div>
      <div id="previsao"></div>
    </div>
    <div class="cartao">
      <h2>Fábricas</h2>
      <div id="fabricas"></div>
    </div>
    <div class="cartao">
      <h2>Erros recentes</h2>
      <div id="erros"></div>
    </div>
    <div class="cartao">
      <h2>Paralelismo</h2>
      <div id="vila-travas"></div>
    </div>
  </section>

  <section id="tela-diario" class="oculto livro diario" aria-label="Diário">
    <div class="cartao oculto" id="diario-filtro">
      <div class="botoes">
        <span class="corpo" id="diario-filtro-nome"></span>
        <button class="acao" id="btn-todas">Todas as fábricas</button>
      </div>
    </div>
    <div class="cartao"><div id="diario"></div></div>
  </section>

  <section id="tela-videos" class="oculto livro cinema" aria-label="Cinema">
    <div class="cartao oculto" id="gerar-cartao">
      <div class="botoes">
        <button class="acao primario" id="btn-gerar">＋ Gerar build</button>
        <span class="fraco" id="restantes"></span>
      </div>
    </div>
    <div class="cartao oculto" id="player-cartao">
      <div class="fraco" id="player-titulo"></div>
      <video id="player" controls playsinline preload="metadata"></video>
    </div>
    <div class="cartao"><div id="videos"></div></div>
  </section>

  <section id="tela-comandos" class="oculto livro bancada" aria-label="Bancada">
    <div class="cartao">
      <h2>Tarefas</h2>
      <div id="tarefas-lista"></div>
      <div id="tarefa-caixa" class="oculto">
        <div class="botoes">
          <span class="corpo" id="tarefa-titulo"></span>
          <button class="acao" id="btn-fechar-log">Fechar</button>
        </div>
        <pre id="tarefa-log" class="log"></pre>
      </div>
    </div>
    <div id="comandos-grupos"></div>
  </section>

  <section id="tela-relatorios" class="oculto livro pergaminho" aria-label="Pergaminhos">
    <div class="abas" id="abas-relatorio"></div>
    <div class="cartao"><pre id="relatorio">Escolha um pergaminho.</pre></div>
  </section>

  <section id="tela-decisoes" class="oculto livro grimorio" aria-label="Grimório">
    <div id="decisoes-listas">
      <div class="abas" id="decisoes-abas"></div>
      <div id="decisoes-lista"></div>
    </div>
    <div id="decisao-item" class="oculto"></div>
  </section>
</main>

<dialog id="dialogo-campos">
  <form method="dialog">
    <div id="campos-corpo"></div>
    <div class="botoes">
      <button class="acao" value="cancelar">Cancelar</button>
      <button class="acao primario" value="ok" id="btn-campos-ok">Continuar</button>
    </div>
  </form>
</dialog>

<dialog id="dialogo">
  <form method="dialog">
    <p id="dialogo-texto"></p>
    <div class="botoes oculto" id="dialogo-destinos">
      <button class="acao" value="youtube">YouTube</button>
      <button class="acao" value="tiktok">TikTok</button>
      <button class="acao" value="ambos">Os dois</button>
    </div>
    <p class="fraco" id="dialogo-prazo"></p>
    <div class="botoes">
      <button class="acao" value="cancelar">Cancelar</button>
      <button class="acao primario" value="confirmar" id="dialogo-sim">Confirmar</button>
    </div>
  </form>
</dialog>

<div id="toast" class="toast oculto" role="status"></div>

<!-- a prateleira da vila: cada objeto abre uma área -->
<nav id="nav" class="prateleira oculto">
  <!-- a lupa mora na prateleira (uma aba de madeira), não solta na grama -->
  <div class="vila-botoes" role="group" aria-label="Zoom da vila">
    <button id="vila-menos" aria-label="Ver a vila inteira">−</button>
    <button id="vila-mais" aria-label="Aproximar">+</button>
  </div>
  <button class="objeto" data-tela="quadro"><span>📌️</span>Avisos</button>
  <button class="objeto" data-tela="diario"><span>📓️</span>Diário</button>
  <button class="objeto" data-tela="videos"><span>🎞️</span>Cinema</button>
  <button class="objeto" data-tela="comandos"><span>🛠️</span>Bancada</button>
  <button class="objeto" data-tela="relatorios"><span>📜️</span>Pergaminhos</button>
  <button class="objeto" data-tela="decisoes"><span>📖️</span>Grimório</button>
</nav>

<script src="app.js"></script>
<script src="vila.js"></script>
<script src="comandos.js"></script>
<script src="decisoes.js"></script>
</body>
</html>
