<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161a">
<title>Painel</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone.svg">
<style>
:root {
  --fundo: #f5f4f0; --cartao: #ffffff; --texto: #1c1d21; --fraco: #6b6e76;
  --linha: #e3e1dc; --ok: #2f7d4f; --erro: #c0392b; --ativo: #d9822b;
  --acento: #3b6fd8;
}
@media (prefers-color-scheme: dark) {
  :root {
    --fundo: #14161a; --cartao: #1e2127; --texto: #e8e8ea; --fraco: #979aa3;
    --linha: #2c3038; --ok: #5cc185; --erro: #ff6b5b; --ativo: #f0a04b;
    --acento: #7ea4ff;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--fundo); color: var(--texto);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  padding-bottom: calc(64px + env(safe-area-inset-bottom));
}
header {
  position: sticky; top: 0; z-index: 2; background: var(--fundo);
  padding: calc(10px + env(safe-area-inset-top)) 16px 8px;
  display: flex; align-items: center; gap: 8px;
  border-bottom: 1px solid var(--linha);
}
header h1 { font-size: 17px; margin: 0; flex: 1; }
#conexao { font-size: 12px; color: var(--fraco); }
#conexao.off { color: var(--erro); font-weight: 600; }
main { padding: 12px 16px; max-width: 640px; margin: 0 auto; }
.cartao {
  background: var(--cartao); border: 1px solid var(--linha);
  border-radius: 12px; padding: 12px 14px; margin-bottom: 12px;
}
.cartao h2 { font-size: 13px; margin: 0 0 8px; color: var(--fraco);
  text-transform: uppercase; letter-spacing: .04em; }
.grande { font-size: 26px; font-weight: 650; }
.fraco { color: var(--fraco); font-size: 13px; }
.linha { display: flex; gap: 10px; align-items: baseline; padding: 6px 0;
  border-top: 1px solid var(--linha); }
.linha:first-of-type { border-top: 0; }
.linha .emoji { width: 1.6em; text-align: center; flex: none; }
.linha .corpo { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.selo { font-size: 11px; padding: 1px 7px; border-radius: 99px;
  border: 1px solid currentColor; flex: none; }
.trabalhando { color: var(--ativo); }
.erro { color: var(--erro); }
.ocioso { color: var(--fraco); }
.ok { color: var(--ok); }
nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 2;
  display: flex; background: var(--cartao); border-top: 1px solid var(--linha);
  padding-bottom: env(safe-area-inset-bottom);
}
nav button {
  flex: 1; border: 0; background: none; color: var(--fraco);
  padding: 10px 0 12px; font: inherit; font-size: 12px;
}
nav button span { display: block; font-size: 20px; line-height: 1.2; }
nav button[aria-current="page"] { color: var(--acento); font-weight: 600; }
button.acao {
  border: 1px solid var(--linha); background: var(--cartao); color: var(--texto);
  border-radius: 8px; padding: 6px 12px; font: inherit;
}
button.primario { background: var(--acento); color: #fff; border-color: transparent; }
input {
  font: inherit; font-size: 24px; letter-spacing: .3em; text-align: center;
  width: 100%; padding: 10px; border-radius: 8px;
  border: 1px solid var(--linha); background: var(--fundo); color: var(--texto);
}
video { width: 100%; max-height: 70vh; border-radius: 10px; background: #000; }
pre { white-space: pre-wrap; font: 13px/1.5 ui-monospace, Consolas, monospace;
  margin: 0; overflow-wrap: anywhere; }
.oculto { display: none !important; }
.abas { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.abas button[aria-pressed="true"] { border-color: var(--acento); color: var(--acento); }
</style>
</head>
<body>
<header>
  <h1 id="titulo">Agora</h1>
  <span id="conexao">…</span>
</header>

<main>
  <section id="tela-parear" class="oculto">
    <div class="cartao">
      <h2>Parear este celular</h2>
      <p>No PC, rode <code>python -m remoto.api_http --parear</code> e digite
        o código de 6 dígitos aqui. Ele vale 5 minutos.</p>
      <input id="codigo" inputmode="numeric" autocomplete="one-time-code"
             maxlength="7" placeholder="000000">
      <p><button class="acao primario" id="btn-parear">Parear</button>
        <span id="parear-msg" class="fraco"></span></p>
    </div>
  </section>

  <section id="tela-agora" class="oculto">
    <div class="cartao">
      <h2>Próxima postagem</h2>
      <div class="grande" id="proxima">—</div>
      <div class="fraco" id="pausa"></div>
      <div id="previsao"></div>
    </div>
    <div class="cartao">
      <h2>Fábricas</h2>
      <div id="fabricas"></div>
    </div>
    <div class="cartao">
      <h2>Erros recentes</h2>
      <div id="erros"></div>
    </div>
  </section>

  <section id="tela-diario" class="oculto">
    <div class="cartao"><div id="diario"></div></div>
  </section>

  <section id="tela-videos" class="oculto">
    <div class="cartao oculto" id="player-cartao">
      <div class="fraco" id="player-titulo"></div>
      <video id="player" controls playsinline preload="metadata"></video>
    </div>
    <div class="cartao"><div id="videos"></div></div>
  </section>

  <section id="tela-relatorios" class="oculto">
    <div class="abas" id="abas-relatorio"></div>
    <div class="cartao"><pre id="relatorio">Escolha um relatório.</pre></div>
  </section>
</main>

<nav id="nav" class="oculto">
  <button data-tela="agora"><span>◉</span>Agora</button>
  <button data-tela="diario"><span>☰</span>Diário</button>
  <button data-tela="videos"><span>▶</span>Vídeos</button>
  <button data-tela="relatorios"><span>▤</span>Relatórios</button>
</nav>

<script>
"use strict";
const TOKEN = "painel.token";
const ULTIMO = "painel.ultimo_estado";
const TITULOS = {agora: "Agora", diario: "Diário", videos: "Vídeos",
                 relatorios: "Relatórios"};
const RELATORIOS = ["metas", "funcionamento", "confiabilidade", "auditoria"];
const $ = (id) => document.getElementById(id);

let tela = "agora";
let diarioDesde = "";
let timer = null;

function el(tag, attrs = {}, ...filhos) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v; else n.setAttribute(k, v);
  }
  for (const f of filhos) if (f != null) n.append(f);
  return n;
}

function hora(iso) {
  const d = new Date(iso);
  return isNaN(d) ? String(iso).slice(11, 16)
    : d.toLocaleTimeString("pt-BR", {hour: "2-digit", minute: "2-digit"});
}

function ha(segundos) {
  if (segundos == null) return "";
  const m = Math.round(segundos / 60);
  if (m < 1) return "agora";
  if (m < 60) return `há ${m} min`;
  const h = Math.floor(m / 60);
  return h < 24 ? `há ${h} h` : `há ${Math.floor(h / 24)} d`;
}

async function api(caminho, opcoes = {}) {
  const token = localStorage.getItem(TOKEN);
  const resp = await fetch(caminho, {
    ...opcoes,
    headers: {...(opcoes.headers || {}),
              ...(token ? {Authorization: `Bearer ${token}`} : {})},
  });
  if (resp.status === 401) { localStorage.removeItem(TOKEN); mostrar(); throw new Error("401"); }
  const dados = await resp.json();
  if (!resp.ok) throw new Error(dados.erro || resp.status);
  return dados;
}

function conexao(ok) {
  const alvo = $("conexao");
  if (ok) {
    alvo.className = "";
    alvo.textContent = "ao vivo · " + hora(new Date().toISOString());
    return;
  }
  const ultimo = JSON.parse(localStorage.getItem(ULTIMO) || "null");
  alvo.className = "off";
  alvo.textContent = ultimo ? `PC sem resposta desde ${hora(ultimo.quando)}`
                            : "PC sem resposta";
}

// ------------------------------------------------------------- agora
function desenharEstado(e) {
  $("proxima").textContent = e.proxima ? e.proxima.horario : "—";
  const pausa = e.pausa || {};
  $("pausa").textContent = pausa.situacao && pausa.situacao !== "rodando"
    ? "⏸ " + pausa.resumo : "▶ " + (pausa.resumo || "");
  $("pausa").className = pausa.situacao && pausa.situacao !== "rodando"
    ? "erro" : "fraco";

  const prev = $("previsao");
  prev.replaceChildren();
  const p = e.previsao;
  if (p && p.calculando) prev.append(el("div", {class: "fraco"}, "calculando o que sai…"));
  else if (p && !p.falhou) {
    const item = (rotulo, v) => v && prev.append(el("div", {class: "linha"},
      el("span", {class: "emoji"}, rotulo),
      el("span", {class: "corpo"}, v.titulo +
        (v.partes > 1 ? ` · parte ${v.parte}/${v.partes}` : ""))));
    item("📖", p.historias);
    item("⚔", p.builds);
    const gordura = Object.entries(p.gordura || {})
      .map(([k, v]) => `${k}: ${v}`).join(" · ");
    if (gordura) prev.append(el("div", {class: "fraco"}, "estoque (dias) — " + gordura));
  }

  const fab = $("fabricas");
  fab.replaceChildren();
  for (const f of e.fabricas || []) {
    fab.append(el("div", {class: "linha"},
      el("span", {class: "emoji"}, f.emoji),
      el("span", {class: "corpo"}, f.rotulo,
        f.detalhe ? el("div", {class: "fraco"}, f.detalhe) : null),
      el("span", {class: "selo " + f.status},
        f.status === "trabalhando" ? "trabalhando"
          : f.status === "erro" ? "erro" : ha(f.ha_s) || "ocioso")));
  }
}

function desenharEventos(alvo, eventos, vazio) {
  if (!eventos.length && vazio) {
    alvo.replaceChildren(el("div", {class: "ok"}, vazio));
    return;
  }
  for (const ev of eventos) {
    alvo.prepend(el("div", {class: "linha"},
      el("span", {class: "emoji"}, ev.emoji || "•"),
      el("span", {class: "corpo"},
        el("span", {class: "fraco"}, hora(ev.ts) + " "),
        ev.detalhe || ev.etapa || ev.fabrica),
      el("span", {class: "selo " + (ev.status === "erro" ? "erro"
        : ev.status === "inicio" ? "trabalhando" : "ocioso")}, ev.status)));
  }
}

async function carregarAgora() {
  try {
    const e = await api("/api/estado");
    localStorage.setItem(ULTIMO, JSON.stringify({quando: new Date().toISOString(), e}));
    desenharEstado(e);
    const erros = await api("/api/erros?n=6");
    $("erros").replaceChildren();
    desenharEventos($("erros"), erros.reverse(), "✓ nenhum erro registrado");
    conexao(true);
  } catch (err) {
    const ultimo = JSON.parse(localStorage.getItem(ULTIMO) || "null");
    if (ultimo) desenharEstado(ultimo.e);
    conexao(false);
  }
}

// ------------------------------------------------------------ diario
async function carregarDiario() {
  try {
    const eventos = await api(`/api/diario?n=80&desde=${encodeURIComponent(diarioDesde)}`);
    if (eventos.length) diarioDesde = eventos[eventos.length - 1].ts;
    desenharEventos($("diario"), eventos);
    conexao(true);
  } catch (err) { conexao(false); }
}

// ------------------------------------------------------------ videos
async function carregarVideos() {
  try {
    const lista = await api("/api/videos?n=60");
    const alvo = $("videos");
    alvo.replaceChildren();
    for (const v of lista) {
      const botao = el("button", {class: "acao"}, "▶");
      botao.addEventListener("click", () => tocar(v));
      const detalhe = [v.canal, v.perfil,
        v.partes > 1 ? `parte ${v.parte}/${v.partes}` : "",
        (v.bytes / 1048576).toFixed(1) + " MB",
        new Date(v.quando * 1000).toLocaleDateString("pt-BR")]
        .filter(Boolean).join(" · ");
      alvo.append(el("div", {class: "linha"},
        el("span", {class: "corpo"}, v.titulo || v.id,
          el("div", {class: "fraco"}, detalhe),
          v.pendencias.length
            ? el("div", {class: "erro"}, "pendente: " + v.pendencias.join(", "))
            : null),
        botao));
    }
    if (!lista.length) alvo.append(el("div", {class: "fraco"}, "nenhum vídeo pronto."));
    conexao(true);
  } catch (err) { conexao(false); }
}

async function tocar(v) {
  try {
    const {url} = await api(`/api/video/${v.canal}/${encodeURIComponent(v.id)}`);
    $("player-cartao").classList.remove("oculto");
    $("player-titulo").textContent = v.titulo;
    const player = $("player");
    player.src = url;
    player.play().catch(() => {});
    window.scrollTo({top: 0, behavior: "smooth"});
  } catch (err) { alert("Não consegui abrir o vídeo: " + err.message); }
}

// -------------------------------------------------------- relatorios
function montarAbas() {
  const abas = $("abas-relatorio");
  for (const nome of RELATORIOS) {
    const b = el("button", {class: "acao", "aria-pressed": "false"}, nome);
    b.addEventListener("click", async () => {
      for (const o of abas.children) o.setAttribute("aria-pressed", String(o === b));
      $("relatorio").textContent = "carregando…";
      try {
        const {texto} = await api(`/api/relatorio/${nome}`);
        $("relatorio").textContent = texto.replace(/[*_`]/g, "");
        conexao(true);
      } catch (err) {
        $("relatorio").textContent = "falhou: " + err.message;
        conexao(false);
      }
    });
    abas.append(b);
  }
}

// ---------------------------------------------------------- pareamento
$("btn-parear").addEventListener("click", async () => {
  const msg = $("parear-msg");
  msg.textContent = "…";
  try {
    const resp = await fetch("/api/parear", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({codigo: $("codigo").value,
                            nome: navigator.userAgentData?.platform || "celular"}),
    });
    const dados = await resp.json();
    if (!resp.ok) throw new Error(dados.erro || resp.status);
    localStorage.setItem(TOKEN, dados.token);
    $("codigo").value = "";
    msg.textContent = "";
    mostrar();
  } catch (err) { msg.textContent = err.message; }
});

// --------------------------------------------------------------- telas
const CARGAS = {agora: [carregarAgora, 15000], diario: [carregarDiario, 5000],
                videos: [carregarVideos, 0], relatorios: [null, 0]};

function mostrar(nova) {
  if (nova) tela = nova;
  const pareado = !!localStorage.getItem(TOKEN);
  const atual = pareado ? tela : "parear";
  for (const s of document.querySelectorAll("main > section"))
    s.classList.toggle("oculto", s.id !== "tela-" + atual);
  $("nav").classList.toggle("oculto", !pareado);
  $("titulo").textContent = pareado ? TITULOS[tela] : "Parear";
  for (const b of document.querySelectorAll("nav button")) {
    if (b.dataset.tela === tela) b.setAttribute("aria-current", "page");
    else b.removeAttribute("aria-current");
  }
  clearInterval(timer);
  if (!pareado) return;
  const [carga, intervalo] = CARGAS[tela];
  if (carga) {
    carga();
    if (intervalo) timer = setInterval(() => {
      if (document.visibilityState === "visible") carga();
    }, intervalo);
  }
}

for (const b of document.querySelectorAll("nav button"))
  b.addEventListener("click", () => mostrar(b.dataset.tela));
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") mostrar();
});
montarAbas();
mostrar();

// Service worker so existe em contexto seguro (HTTPS do `tailscale serve`).
if ("serviceWorker" in navigator && window.isSecureContext)
  navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
