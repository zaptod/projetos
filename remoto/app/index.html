<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161a">
<title>Painel</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone.svg">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header>
  <h1 id="titulo">Agora</h1>
  <span id="conexao">…</span>
</header>
<div id="aviso" class="aviso oculto" role="status">
  <span id="aviso-texto"></span>
  <button class="acao" id="btn-tentar">Tentar de novo</button>
</div>

<main>
  <section id="tela-parear" class="oculto">
    <div class="cartao">
      <h2>Parear este celular</h2>
      <p>No PC, rode <code>python -m remoto.api_http --parear</code> e digite
        o código de 6 dígitos aqui. Ele vale 5 minutos.</p>
      <input id="codigo" inputmode="numeric" autocomplete="one-time-code"
             maxlength="7" placeholder="000000">
      <p><button class="acao primario" id="btn-parear">Parear</button>
        <span id="parear-msg" class="fraco"></span></p>
    </div>
  </section>

  <section id="tela-agora" class="oculto">
    <div class="cartao">
      <h2>Próxima postagem</h2>
      <div class="grande" id="proxima">—</div>
      <div class="fraco" id="pausa"></div>
      <div id="previsao"></div>
    </div>
    <div class="cartao">
      <h2>Fábricas</h2>
      <div id="fabricas"></div>
    </div>
    <div class="cartao">
      <h2>Erros recentes</h2>
      <div id="erros"></div>
    </div>
  </section>

  <section id="tela-diario" class="oculto">
    <div class="cartao"><div id="diario"></div></div>
  </section>

  <section id="tela-videos" class="oculto">
    <div class="cartao oculto" id="player-cartao">
      <div class="fraco" id="player-titulo"></div>
      <video id="player" controls playsinline preload="metadata"></video>
    </div>
    <div class="cartao"><div id="videos"></div></div>
  </section>

  <section id="tela-relatorios" class="oculto">
    <div class="abas" id="abas-relatorio"></div>
    <div class="cartao"><pre id="relatorio">Escolha um relatório.</pre></div>
  </section>
</main>

<nav id="nav" class="oculto">
  <button data-tela="agora"><span>◉</span>Agora</button>
  <button data-tela="diario"><span>☰</span>Diário</button>
  <button data-tela="videos"><span>▶</span>Vídeos</button>
  <button data-tela="relatorios"><span>▤</span>Relatórios</button>
</nav>

<script src="app.js"></script>
</body>
</html>
