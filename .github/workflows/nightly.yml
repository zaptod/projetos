name: Nightly

# Onda 6: a matriz completa (546 lutas) em modo STRICT — a régua de fim de
# programa, onde QUALQUER métrica fora de faixa bloqueia (exit 2). O push
# roda o smoke barato (ci.yml); a verdade cara roda de madrugada.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  corpus-completo:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
      NEURAL_FIGHTS_RUNTIME_DIR: ${{ runner.temp }}/neural-fights-runtime

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Corpus completo (strict, onda 6)
        run: >-
          python -m neural_fights.tools.qualidade_luta
          --corpus completo --dados engine --onda 6 --strict
          --out relatorio_nightly.json
      - name: Relatorio como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-qualidade-nightly
          path: relatorio_nightly.json
