name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip check
      - run: python -m ruff check .
      - run: python -m compileall -q ai core data effects models simulation tournament ui utils
      - run: python -m unittest discover -s tests -p "test_*.py" -v
      - run: python -m tools.auditoria_skills --strict
      - run: python -m tools.analise_armas --strict
      - run: python -m tools.diagnostico_hitbox --strict
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - run: neural-fights-audit-skills --strict
        working-directory: ${{ runner.temp }}
