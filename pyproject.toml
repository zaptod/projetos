[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-fights"
version = "12.0.0"
description = "Simulador de combate 2D com lutadores controlados por IA"
requires-python = ">=3.10"
dependencies = [
    "pygame-ce>=2.5.7,<3",
    "customtkinter>=5.2,<6",
]

[project.scripts]
neural-fights = "run:main"
neural-fights-tournament = "run_tournament:main"
neural-fights-headless = "test_headless_battle:main"
neural-fights-roster = "scripts.gerar_roster:main"
neural-fights-migrate-database = "tools.migrar_database:main"
neural-fights-audit-skills = "tools.auditoria_skills:main"

[tool.setuptools]
include-package-data = true
py-modules = ["run", "run_tournament", "test_manual", "test_headless_battle"]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "ai*",
    "core*",
    "data*",
    "effects*",
    "models*",
    "scripts*",
    "simulation*",
    "tools*",
    "tournament*",
    "ui*",
    "utils*",
]
exclude = ["examples*", "tests*"]
namespaces = false

[tool.setuptools.package-data]
data = ["*.json", "fixtures/*.json"]

[tool.setuptools.data-files]
sounds = ["sounds/*.json", "sounds/*.mp3", "sounds/*.wav"]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["**/__pycache__"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
