[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-fights"
version = "12.0.0"
description = "Simulador de combate 2D com lutadores controlados por IA"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pygame-ce>=2.5.7,<3",
    "customtkinter>=5.2,<6",
]

[project.scripts]
neural-fights = "neural_fights.cli.main:main"
neural-fights-tournament = "neural_fights.cli.tournament:main"
neural-fights-headless = "neural_fights.cli.headless:main"
neural-fights-live = "neural_fights.cli.live:main"
neural-fights-roster = "neural_fights.cli.roster:main"
neural-fights-migrate-database = "neural_fights.tools.migrar_database:main"
neural-fights-audit-skills = "neural_fights.tools.auditoria_skills:main"
neural-fights-audit-commands = "neural_fights.tools.auditoria_comandos:main"
neural-fights-audit-personalities = "neural_fights.tools.auditoria_personalidades:main"
neural-fights-fight-quality = "neural_fights.tools.qualidade_luta:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["neural_fights*"]
exclude = ["tests*", "examples*"]
namespaces = false

[tool.setuptools.package-data]
"neural_fights.data" = ["*.json", "fixtures/*.json"]
"neural_fights.sounds" = ["*.json", "*.mp3", "*.wav", "*.ogg"]

[project.optional-dependencies]
# A integracao com o YouTube usa apenas a biblioteca padrao (urllib + json).
# O extra existe como ponto de extensao declarado: se um dia um provedor exigir
# um SDK, ele entra aqui sem engordar a instalacao basica.
live = []
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["**/__pycache__"]

[tool.ruff.lint]
select = ["E9", "E722", "F401", "F541", "F63", "F7", "F82", "F841"]
